[workspace]
resolver = "3"
members = ["app", "client"]

[package]
name = "freebet-ledger"
version = "0.1.0"
edition = "2024"
build = "build.rs"

[dependencies]
freebet-ledger-app = { path = "app" }

[build-dependencies]
sails-rs = { version = "=0.10.2", features = ["build"] }
sails-idl-gen = "=0.10.2"
freebet-ledger-app = { path = "app" }

[dev-dependencies]
futures = "0.3"
gtest = "1.10.0"
freebet-ledger-client = { path = "client" }
polymarket-mirror = { path = "../program", features = ["wasm-binary"] }
polymarket-mirror-client = { path = "../program/client" }
sails-rs = { version = "=0.10.2", features = ["gtest"] }
schnorrkel = "0.10"

[features]
wasm-binary = []

[[test]]
name = "freebet_ledger_gtest"
path = "tests/freebet_ledger_gtest.rs"
required-features = ["wasm-binary"]

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1

[profile.release.package."*"]
opt-level = 3
strip = true
